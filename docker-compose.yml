services:
  auth-service:
    build:
      context: ./auth-service
    ports:
      - "5001:5001"
    env_file:
      - ./auth-service/.env

  restaurant-service:
    build:
      context: ./restaurant-service
    ports:
      - "5002:5002"
    env_file:
      - ./restaurant-service/.env

  order-service:
    build:
      context: ./order-service
    ports:
      - "5003:5003"
    env_file:
      - ./order-service/.env

  delivery-service:
    build:
      context: ./delivery-service

  customer-service:
    build:
      context: ./customer-service
