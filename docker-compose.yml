    env_file:
      - ./auth-service/.env

  restaurant-service:
    build:
      context: ./restaurant-service

  order-service:
    build:
      context: ./order-service

  delivery-service:
    build:
      context: ./delivery-service

  customer-service:
    build:
      context: ./customer-service
